<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1年 音楽 テスト勉強ナビ</title>
<style>
:root{
  --bg:#f7f5ef; --card:#fff; --ink:#23252b; --sub:#5d6270; --line:#e2ded3;
  --g:#2f6fd6; --gs:#e8f0fd;   /* 楽典 */
  --m:#7a4fc9; --ms:#f1ebfb;   /* 魔法使いの弟子 */
  --y:#d9692b; --ys:#fdeee4;   /* 民謡・アジア */
  --ok:#1f9d55; --ng:#d64545; --k:#d6336c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;line-height:1.7;font-size:17px}
button{font:inherit;cursor:pointer}
header{background:#23252b;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1;cursor:pointer}
header .btn-mini{background:#ffffff22;color:#fff;border:0;border-radius:8px;padding:6px 12px;font-size:15px}
main{max-width:860px;margin:0 auto;padding:18px 16px 60px}
h2{font-size:22px;margin:6px 0 12px}
h3{font-size:18px;margin:0 0 8px}
.lead{color:var(--sub);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.ucard{background:var(--card);border-radius:16px;padding:18px;border:2px solid var(--line);cursor:pointer;transition:.15s;position:relative}
.ucard:hover{transform:translateY(-2px);box-shadow:0 6px 18px #0001}
.ucard .ic{font-size:34px}
.ucard h3{font-size:20px;margin:6px 0 4px}
.ucard p{margin:0;color:var(--sub);font-size:15px}
.ucard .best{position:absolute;top:14px;right:14px;font-size:13px;background:#0000000d;border-radius:20px;padding:2px 10px}
.u-g{border-color:var(--g)} .u-g h3{color:var(--g)}
.u-m{border-color:var(--m)} .u-m h3{color:var(--m)}
.u-y{border-color:var(--y)} .u-y h3{color:var(--y)}
.u-all{border-color:#23252b}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.tabs button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 16px}
.tabs button.on{background:var(--c);border-color:var(--c);color:#fff}
.sec{background:var(--card);border-radius:14px;padding:16px 18px;margin:0 0 14px;border-left:6px solid var(--c)}
.sec p{margin:.3em 0}
.sec ul{margin:.3em 0;padding-left:1.3em}
.star{display:inline-block;background:#ffe066;color:#5a4500;font-size:12px;font-weight:bold;border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:middle}
table{border-collapse:collapse;width:100%;font-size:15.5px;margin:6px 0}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--cs)}
.tw{overflow-x:auto}
b.k{color:var(--k)}
.hide-k b.k{color:transparent;background:#f3c2d3;border-radius:4px;cursor:pointer;user-select:none}
.hide-k b.k.show{color:var(--k);background:#fde7ef}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.btn{border:0;border-radius:10px;padding:10px 18px;background:var(--c,#23252b);color:#fff;font-weight:bold}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.big{font-size:19px;padding:14px 26px}
.note{font-size:14.5px;color:var(--sub)}
.warn{background:#fff6db;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:15.5px}
.map{background:var(--cs);border-radius:14px;padding:12px 16px;margin:0 0 14px;font-size:16px}
.map ol{margin:4px 0 0;padding-left:1.4em}
.memo{background:#eef7ee;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:15.5px}
.play{border:0;background:var(--c);color:#fff;border-radius:8px;padding:2px 10px;font-size:14px;margin-left:6px}
/* quiz */
.qbox{background:var(--card);border-radius:16px;padding:20px;border-top:6px solid var(--c)}
.qhead{display:flex;justify-content:space-between;color:var(--sub);font-size:14px;margin-bottom:6px}
.bar{height:6px;background:#eee;border-radius:3px;margin-bottom:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}
.qtext{font-size:20px;font-weight:bold;margin:0 0 10px}
.fig{text-align:center;margin:6px 0 12px}
.fig svg{max-width:100%;height:auto}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font-size:17px}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt.ok{border-color:var(--ok);background:#e6f6ec}
.opt.ng{border-color:var(--ng);background:#fdeaea}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px}
.fb.ok{background:#e6f6ec}.fb.ng{background:#fdeaea}
.fb b.t{font-size:18px}
.res{text-align:center;padding:10px}
.res .score{font-size:56px;font-weight:bold;color:var(--c)}
.mlist{text-align:left;margin-top:14px}
.mitem{background:#fff;border-radius:10px;padding:10px 14px;margin:8px 0;border-left:5px solid var(--ng)}
.mitem .a{color:var(--ok);font-weight:bold}
/* flash */
.flash{background:var(--card);border-radius:18px;min-height:220px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:3px solid var(--c);cursor:pointer}
.flash .fq{font-size:21px;font-weight:bold}
.flash .fa{font-size:22px;color:var(--k);font-weight:bold;margin-top:16px}
.flash .hint{color:var(--sub);font-size:14px;margin-top:14px}
.frow{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.c-g{--c:var(--g);--cs:var(--gs)} .c-m{--c:var(--m);--cs:var(--ms)} .c-y{--c:var(--y);--cs:var(--ys)} .c-all{--c:#23252b;--cs:#eee}
.dyn{font-family:"Times New Roman",serif;font-style:italic;font-weight:bold;font-size:1.15em}
.mus{font-family:"Segoe UI Symbol","Noto Music",serif}
footer{text-align:center;color:var(--sub);font-size:13px;padding:20px}
</style>
</head>
<body>
<header><h1 id="home">🎵 1年 音楽 テスト勉強ナビ</h1><button class="btn-mini" id="hideBtn" style="display:none">🙈 赤字をかくす</button></header>
<main id="app"></main>
<footer>教育出版「中学音楽1」の授業（楽典・魔法使いの弟子・日本の民謡とアジアの声）の内容から作成。記録はこの端末だけに保存されます。</footer>

<script>
"use strict";
/* ========== 保存 ========== */
const store={get(k,d){try{const v=localStorage.getItem('ongaku1-'+k);return v?JSON.parse(v):d}catch(e){return d}},
 set(k,v){try{localStorage.setItem('ongaku1-'+k,JSON.stringify(v))}catch(e){}}};

/* ========== 音 ========== */
let actx=null;
function playSeq(midis,dur=0.42){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();}catch(e){return}
  const t0=actx.currentTime+0.05;
  midis.forEach((m,i)=>{const o=actx.createOscillator(),g=actx.createGain();
    o.type='triangle';o.frequency.value=440*Math.pow(2,(m-69)/12);
    const t=t0+i*dur;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.32,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+dur*.95);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur);});
}
const SCALES={ritsu:[60,62,65,67,69,72],miyako:[60,61,65,67,68,72],minyo:[60,63,65,67,70,72],okinawa:[60,64,65,67,71,72],major:[60,62,64,65,67,69,71,72]};

/* ========== 楽譜の図（SVG） ========== */
const ST={top:30,s:10};
const yOf=p=>ST.top+40-p*5;
function head(x,y,fill){return `<ellipse cx="${x}" cy="${y}" rx="6.4" ry="4.5" transform="rotate(-20 ${x} ${y})" fill="${fill?'#222':'#fff'}" stroke="#222" stroke-width="1.7"/>`}
function stem(x,y,up){return up?`<line x1="${x+5.7}" y1="${y-1}" x2="${x+5.7}" y2="${y-34}" stroke="#222" stroke-width="1.5"/>`:`<line x1="${x-5.7}" y1="${y+1}" x2="${x-5.7}" y2="${y+34}" stroke="#222" stroke-width="1.5"/>`}
function flag(x,y,n){let s='';for(let i=0;i<n;i++){const sy=y-34+i*8;s+=`<path d="M${x+5.7} ${sy} C${x+7} ${sy+8},${x+17} ${sy+10},${x+14} ${sy+22}" fill="none" stroke="#222" stroke-width="2.4"/>`}return s}
function ledgers(x,p){let s='';const L=q=>`<line x1="${x-11}" x2="${x+11}" y1="${yOf(q)}" y2="${yOf(q)}" stroke="#222" stroke-width="1.3"/>`;
  for(let q=-2;q>=p;q-=2)s+=L(q);for(let q=10;q<=p;q+=2)s+=L(q);return s}
function lines(w,x0=4){let s='';for(let i=0;i<5;i++)s+=`<line x1="${x0}" x2="${w-4}" y1="${ST.top+i*ST.s}" y2="${ST.top+i*ST.s}" stroke="#222" stroke-width="1.2"/>`;return s}
function clefSVG(c){return c==='g'?`<text x="6" y="${ST.top+46}" font-size="66" class="mus">𝄞</text>`:`<text x="8" y="${ST.top+31}" font-size="44" class="mus">𝄢</text>`}
function staffSVG({clef='g',notes=[],w=200,arrows=[]}){
  let g=`<svg viewBox="0 0 ${w} 110" width="${w*1.5}">`+lines(w)+(clef?clefSVG(clef):'');
  notes.forEach(({p,x})=>{const y=yOf(p);g+=ledgers(x,p)+head(x,y,true)+stem(x,y,p<4)});
  arrows.forEach(({p,label})=>{const y=yOf(p);g+=`<line x1="${w-36}" x2="${w-8}" y1="${y}" y2="${y}" stroke="#d6336c" stroke-width="2.5"/><text x="${w-60}" y="${y+5}" fill="#d6336c" font-size="14" font-weight="bold">${label}</text>`});
  return g+'</svg>'}
function noteSym(type){ // 音符・休符を1つ描く
  const x=40,p=3,y=yOf(p);let g=`<svg viewBox="0 0 90 110" width="135">`;
  if(type==='w')g+=`<ellipse cx="${x}" cy="${y}" rx="8" ry="5" fill="#fff" stroke="#222" stroke-width="2.6"/>`;
  else{const fill=type!=='h';g+=head(x,y,fill)+stem(x,y,true);if(type==='e')g+=flag(x,y,1);if(type==='s')g+=flag(x,y,2)}
  return g+'</svg>'}
function restPair(){ // 全休符・2分休符（どちらかを当てる）
  let g=`<svg viewBox="0 0 220 110" width="330">`+lines(220);
  g+=`<rect x="55" y="${ST.top+10}" width="16" height="6" fill="#222"/><text x="63" y="100" text-anchor="middle" font-size="16" font-weight="bold">ア</text>`;
  g+=`<rect x="150" y="${ST.top+14}" width="16" height="6" fill="#222"/><text x="158" y="100" text-anchor="middle" font-size="16" font-weight="bold">イ</text>`;
  return g+'</svg>'}
function lineSpaceFig(){ // 線と間の名前
  let g=`<svg viewBox="0 0 260 110" width="390">`+lines(200);
  [[2,'第2線'],[5,'第3間'],[8,'第5線']].forEach(([p,l],i)=>{const y=yOf(p);g+=`<line x1="200" x2="215" y1="${y}" y2="${y}" stroke="#d6336c" stroke-width="2"/><text x="218" y="${y+5}" font-size="13" fill="#d6336c" font-weight="bold">${['ア','イ','ウ'][i]}</text>`});
  return g+'</svg>'}
function repeatFig(ms){ // ms: [{l,rs,re,v,fin}]
  const W=62,x0=10,top=34,h=40;let w=x0+ms.length*W+14;let g=`<svg viewBox="0 0 ${w} 90" width="${Math.min(w*1.6,560)}">`;
  ms.forEach((m,i)=>{const x=x0+i*W;
    g+=`<line x1="${x}" x2="${x+W}" y1="${top}" y2="${top}" stroke="#222"/><line x1="${x}" x2="${x+W}" y1="${top+h}" y2="${top+h}" stroke="#222"/>`;
    g+=`<text x="${x+W/2}" y="${top+h/2+7}" text-anchor="middle" font-size="20" font-weight="bold">${m.l}</text>`;
    if(m.v){g+=`<path d="M${x+3} ${top-4} V${top-18} H${x+W-4}${m.v===1?` V${top-4}`:''}" fill="none" stroke="#222" stroke-width="1.4"/><text x="${x+7}" y="${top-6}" font-size="12">${m.v}.</text>`}
  });
  // 縦線
  for(let i=0;i<=ms.length;i++){const x=x0+i*W,prev=ms[i-1],cur=ms[i];
    if(cur&&cur.rs){g+=`<rect x="${x}" y="${top}" width="4" height="${h}" fill="#222"/><line x1="${x+8}" x2="${x+8}" y1="${top}" y2="${top+h}" stroke="#222" stroke-width="1.3"/><circle cx="${x+13}" cy="${top+15}" r="2.4"/><circle cx="${x+13}" cy="${top+25}" r="2.4"/>`}
    else if(prev&&prev.re){g+=`<circle cx="${x-13}" cy="${top+15}" r="2.4"/><circle cx="${x-13}" cy="${top+25}" r="2.4"/><line x1="${x-8}" x2="${x-8}" y1="${top}" y2="${top+h}" stroke="#222" stroke-width="1.3"/><rect x="${x-4}" y="${top}" width="4" height="${h}" fill="#222"/>`}
    else if(i===ms.length){g+=`<line x1="${x-7}" x2="${x-7}" y1="${top}" y2="${top+h}" stroke="#222" stroke-width="1.3"/><rect x="${x-4}" y="${top}" width="4" height="${h}" fill="#222"/>`}
    else g+=`<line x1="${x}" x2="${x}" y1="${top}" y2="${top+h}" stroke="#222" stroke-width="1.3"/>`;
  }
  return g+'</svg>'}

/* ========== 共通の表 ========== */
const NAMES={doremi:['ド','レ','ミ','ファ','ソ','ラ','シ'],iroha:['ハ','ニ','ホ','ヘ','ト','イ','ロ'],eng:['C','D','E','F','G','A','B']};
const SYS_LABEL={doremi:'ドレミ（階名・イタリア語）',iroha:'日本の音名',eng:'英語の音名'};
const DYN=[['pp','ピアニッシモ','とても弱く'],['p','ピアノ','弱く'],['mp','メッゾ ピアノ','少し弱く'],['mf','メッゾ フォルテ','少し強く'],['f','フォルテ','強く'],['ff','フォルティッシモ','とても強く']];
const TEMPO=[['Adagio','アダージョ','ゆるやかに'],['Andante','アンダンテ','歩くような速さで'],['Moderato','モデラート','中ぐらいの速さで'],['Allegro','アレグロ','速く']];
const DUR=[['w','全音符','4拍'],['h','2分音符','2拍'],['q','4分音符','1拍'],['e','8分音符','半拍（2分の1拍）'],['s','16分音符','4分の1拍']];

/* ========== 単元データ ========== */
const UNITS={
g:{name:'楽典（楽譜を読む基礎）',short:'楽典',ic:'🎼',cls:'c-g',card:'u-g',desc:'五線・音名・音符・拍子・強弱・速度・反復記号'},
m:{name:'鑑賞「魔法使いの弟子」',short:'魔法使いの弟子',ic:'🧹',cls:'c-m',card:'u-m',desc:'デュカス・交響詩・ほうきの主題・聴く手がかり'},
y:{name:'鑑賞「日本の民謡とアジアの声」',short:'民謡とアジアの声',ic:'🏮',cls:'c-y',card:'u-y',desc:'民謡の役割・拍・こぶし・五音音階・アジアの声'}
};

/* ---- まとめ（b.k ＝ 赤字・かくせる語句） ---- */
const SUMMARY={
g:()=>`
<div class="map"><b>🗺 この単元の全体像</b>　楽譜は「<b>どの高さ</b>の音を」「<b>どれだけの長さ</b>で」「<b>どんなふうに</b>」演奏するかを書いたもの。
<ol><li>高さを読む … ① 五線　② 音部記号　③ 音名</li>
<li>長さを読む … ④ 音符と休符　⑤ 拍子</li>
<li>表情を読む … ⑥ 強弱　⑦ 速度</li>
<li>進み方を読む … ⑧ 反復記号</li></ol></div>
<div class="sec"><h3>① 五線と加線<span class="star">★ここ大事</span></h3>
<p>五線の線と間（線と線のあいだ）は、<b class="k">下から</b>数える。<b class="k">第1線〜第5線</b>、<b class="k">第1間〜第4間</b>。</p>
<p>五線からはみ出す高い音・低い音は、短い線＝<b class="k">加線</b>をたして書く。</p>
<div class="fig">${lineSpaceFig()}</div><p class="note">ア＝第2線　イ＝第3間　ウ＝第5線</p></div>

<div class="sec"><h3>② 音部記号<span class="star">★ここ大事</span></h3>
<div class="tw"><table><tr><th>記号</th><th>名前</th><th>基準</th><th>使う音域</th></tr>
<tr><td class="mus" style="font-size:30px">𝄞</td><td><b class="k">ト音記号</b></td><td><b class="k">第2線</b>が ト（ソ）</td><td>高い音</td></tr>
<tr><td class="mus" style="font-size:30px">𝄢</td><td><b class="k">ヘ音記号</b></td><td><b class="k">第4線</b>が ヘ（ファ）</td><td>低い音</td></tr></table></div>
<div class="memo">💡 名前がそのまま答え。<b>ト</b>音記号は「ト（ソ）の場所」、<b>ヘ</b>音記号は「ヘ（ファ）の場所」を教える記号。</div></div>

<div class="sec"><h3>③ 音名<span class="star">★ここ大事</span></h3>
<div class="tw"><table><tr><th>ドレミ</th><td>ド</td><td>レ</td><td>ミ</td><td>ファ</td><td>ソ</td><td>ラ</td><td>シ</td></tr>
<tr><th>日本の音名</th><td><b class="k">ハ</b></td><td><b class="k">ニ</b></td><td><b class="k">ホ</b></td><td><b class="k">ヘ</b></td><td><b class="k">ト</b></td><td><b class="k">イ</b></td><td><b class="k">ロ</b></td></tr>
<tr><th>英語</th><td>C</td><td>D</td><td>E</td><td>F</td><td>G</td><td>A</td><td>B</td></tr>
<tr><th>ドイツ語</th><td>C</td><td>D</td><td>E</td><td>F</td><td>G</td><td>A</td><td><b class="k">H</b>（ハー）</td></tr></table></div>
<ul><li>「イロハ」は <b class="k">ラ（A）</b>から始まる。</li><li>ドイツ語では シ＝<b class="k">H</b>。ドイツ語の <b>B</b> は <b class="k">シ♭</b> のこと。</li></ul>
<p>譜読みは「ト音記号は第2線がソ」「ヘ音記号は第4線がファ」から数えるとまちがえにくい。<button class="play" data-play="major">▶ ドレミを聴く</button></p>
<div class="fig">${staffSVG({clef:'g',w:300,notes:[-2,-1,0,1,2,3,4,5].map((p,i)=>({p,x:58+i*30}))})}</div>
<p class="note" style="text-align:center">ト音記号の ド レ ミ ファ ソ ラ シ ド（はじめのドは加線の上）</p>
<div class="fig">${staffSVG({clef:'f',w:300,notes:[3,4,5,6,7,8,9,10].map((p,i)=>({p,x:58+i*30}))})}</div>
<p class="note" style="text-align:center">ヘ音記号の ド レ ミ ファ ソ ラ シ ド（最後のドは加線の上）</p></div>

<div class="sec"><h3>④ 音符と休符<span class="star">★ここ大事</span></h3>
<p class="note">4分音符を1拍としたとき。休符の長さも同じ。</p>
<div class="memo">💡 全音符（4拍）から、下へ行くたびに<b>半分</b>になる：4拍 → 2拍 → 1拍 → 半拍 → 4分の1拍。</div>
<div class="tw"><table><tr><th>音符</th><th>名前</th><th>長さ</th></tr>
${DUR.map(d=>`<tr><td>${noteSym(d[0]).replace('width="135"','width="60"')}</td><td><b class="k">${d[1]}</b></td><td><b class="k">${d[2]}</b></td></tr>`).join('')}</table></div>
<div class="fig">${restPair()}</div>
<p>ア＝<b class="k">全休符</b>（線から<b class="k">ぶら下がる</b>）　イ＝<b class="k">2分休符</b>（線の上に<b class="k">乗る</b>）</p>
<p>全休符は「<b class="k">1小節まるごと休む</b>」ときにも使う。</p></div>

<div class="sec"><h3>⑤ 拍子と小節<span class="star">★ここ大事</span></h3>
<p>拍子記号 <b style="font-size:20px">4分の3拍子（3/4）</b> …</p>
<ul><li>下の数字＝<b class="k">1拍にする音符</b>（4 → 4分音符）</li><li>上の数字＝<b class="k">1小節の拍の数</b>（3 → 3拍）</li></ul>
<p>小節を区切る線＝<b class="k">小節線</b>、曲の終わりの線（細い線＋太い線）＝<b class="k">終止線</b>。</p>
<p class="note">例：4分の3拍子の1小節 ＝ 2分音符（2拍）＋4分音符（1拍）</p>
<div class="warn">⚠ 上と下を逆に覚えやすい。「4分の3拍子」と読む順番どおり、<b>下の4＝4分音符</b>、<b>上の3＝3拍</b>。</div></div>

<div class="sec"><h3>⑥ 強弱記号<span class="star">★ここ大事</span></h3>
<div class="tw"><table><tr><th>記号</th><th>読み方</th><th>意味</th></tr>
${DYN.map(d=>`<tr><td class="dyn">${d[0]}</td><td><b class="k">${d[1]}</b></td><td><b class="k">${d[2]}</b></td></tr>`).join('')}
<tr><td><i>cresc.</i></td><td>クレシェンド</td><td><b class="k">だんだん強く</b></td></tr>
<tr><td><i>dim.</i>／<i>decresc.</i></td><td>ディミヌエンド／デクレシェンド</td><td><b class="k">だんだん弱く</b></td></tr></table></div>
<p>弱い順：<b class="k">pp → p → mp → mf → f → ff</b></p>
<div class="memo">💡 <span class="dyn">p</span>＝弱く、<span class="dyn">f</span>＝強く。2つ重ねると「とても」（<span class="dyn">pp</span>・<span class="dyn">ff</span>）、<span class="dyn">m</span>（メッゾ）がつくと「少し」（<span class="dyn">mp</span>・<span class="dyn">mf</span>）。</div></div>

<div class="sec"><h3>⑦ 速度記号<span class="star">★ここ大事</span></h3>
<p><b>♩＝96</b> … 1分間に<b class="k">4分音符を96回</b>打つ速さ。</p>
<div class="tw"><table><tr><th>記号</th><th>読み方</th><th>意味</th></tr>
${TEMPO.map(d=>`<tr><td><i>${d[0]}</i></td><td>${d[1]}</td><td><b class="k">${d[2]}</b></td></tr>`).join('')}
<tr><td><i>rit.</i></td><td>リタルダンド</td><td><b class="k">だんだん遅く</b></td></tr>
<tr><td><i>a tempo</i></td><td>ア テンポ</td><td><b class="k">もとの速さで</b></td></tr></table></div>
<p>遅い順：<b class="k">Adagio → Andante → Moderato → Allegro</b></p>
<div class="warn">⚠ 強弱と速度をまぜない。<b>cresc.・dim.</b> は強さ、<b>rit.・a tempo</b> は速さの記号。</div></div>

<div class="sec"><h3>⑧ 反復記号<span class="star">★ここ大事</span></h3>
<p><b class="k">リピート記号</b>のあいだをくり返す。</p>
<div class="fig">${repeatFig([{l:'A'},{l:'B',rs:1},{l:'C',re:1},{l:'D'}])}</div>
<p>演奏順：<b class="k">A B C B C D</b></p>
<p><b class="k">1番かっこ・2番かっこ</b>：1回目は1番かっこ、くり返した2回目は1番かっこをとばして2番かっこへ。</p>
<div class="fig">${repeatFig([{l:'A',rs:1},{l:'B'},{l:'C',v:1,re:1},{l:'D',v:2}])}</div>
<p>演奏順：<b class="k">A B C A B D</b></p>
<div class="memo">💡 たどり方：① リピート記号の終わりまで進む → ② 始まりの記号（なければ曲のはじめ）にもどる → ③ 2回目は1番かっこをとばして2番かっこへ。</div></div>
<p class="note">※ グイード・ダレッツォ…線を使って音の高さを表す方法を広めた人（導入の話題）。</p>`,

<div class="memo">💡 分け方：ほかの人が聴いても<b>同じように確かめられる</b>こと＝音の特徴。<b>人によってちがう</b>こと＝感じたこと・想像。</div>
<p>まとめる順番：<b class="k">場面 → 音の特徴 → 感じたこと → 映像とのつながり</b>（2〜3文）</p>

<tr><td><b class="k">天台声明</b><br>（てんだいしょうみょう）</td><td>日本</td><td><b class="k">経典</b>に<b class="k">節をつけて</b>、ゆったり唱える。1人の声とみんなの声が受けわたされる</td><td><b class="k">仏教の儀式</b>（僧侶が唱える）</td></tr>
<tr><td><b class="k">ケチャ</b></td><td><b class="k">インドネシア</b>（バリ島）</td><td>大勢が「チャッ」の<b class="k">リズムを少しずつずらして重ね</b>、細かく速いリズムを作る。<b class="k">ガムラン</b>（主に金属製の打楽器の合奏）を<b class="k">声で表した</b>ものといわれる</td><td>「<b class="k">ラーマーヤナ</b>」の物語の<b class="k">舞踊劇</b></td></tr>
<tr><td><b class="k">オルティンドー</b></td><td><b class="k">モンゴル</b></td><td>「<b class="k">長い歌</b>」。息を長くのばし、<b class="k">拍のないリズム</b>で歌う。伴奏は<b class="k">馬頭琴</b>（モリンホール）など</td><td>祝いの席や祭りなど</td></tr>
<tr><td><b class="k">ホーミー</b></td><td><b class="k">モンゴル</b></td><td><b class="k">1人で</b>、<b class="k">低い声</b>と<b class="k">笛のような高い響き</b>を同時に聴かせる</td><td>祭りやくらしの中で</td></tr>
<tr><td><b class="k">布農（ブヌン）族の合唱</b></td><td><b class="k">台湾</b></td><td><b class="k">輪になって</b>、いくつもの高さの声を<b class="k">重ねて</b>響かせる</td><td>アワなどの種まきのころ、<b class="k">豊作を願って</b>歌う（一例）</td></tr></table></div>
<ul><li>声明は<b class="k">6世紀ごろ</b>仏教とともに伝わったと考えられ、天台声明は<b class="k">平安時代</b>から天台宗で受けつがれてきた。</li>
<li>遠くはなれていても、<b class="k">長くのばす歌い方</b>（<b class="k">江差追分</b>と<b class="k">オルティンドー</b>）のように似ているところもある。</li>
<li>声の音楽は、祈り・仕事・祭り・自然など<b class="k">くらしや信仰</b>と結びついて、その土地ならではの表現が生まれた。</li></ul>
<div class="memo">💡 <b>キーワード1つで見分ける</b><br>
天台声明＝<b>経典に節</b>／ケチャ＝<b>ずらして重ねる</b>／オルティンドー＝<b>長い歌</b>／ホーミー＝<b>1人で2つの音</b>／布農族の合唱＝<b>輪になって重ねる</b><br>
モンゴルは2つある（オルティンドーとホーミー）。</div>

/* ---- 自動で作る問題（楽典） ---- */
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const GEN={
 read(){const clef=Math.random()<.6?'g':'f';const p=clef==='g'?Math.floor(Math.random()*8)-2:3+Math.floor(Math.random()*8);
   const idx=((clef==='g'?2:4)+p)%7, sys=pick(['doremi','iroha','eng']);const N=NAMES[sys];
   const a=N[idx],w=shuffle(N.filter(n=>n!==a)).slice(0,3);
   return {id:`gr-${clef}${p}-${sys}`,u:'g',q:`${clef==='g'?'ト音記号':'ヘ音記号'}の この音を、${SYS_LABEL[sys]}で答えよう。`,fig:staffSVG({clef,w:150,notes:[{p,x:105}]}),a,w,
     ex:`${clef==='g'?'ト音記号は第2線がソ（ト）':'ヘ音記号は第4線がファ（ヘ）'}。ここから数えると「${NAMES.doremi[idx]}」＝${NAMES.iroha[idx]}＝${NAMES.eng[idx]}。`}},
 dur(){const d=pick(DUR),mode=Math.random()<.5;const others=shuffle(DUR.filter(x=>x!==d)).slice(0,3);
   return mode?{id:`gd-${d[0]}-n`,u:'g',q:'この音符の名前は？',fig:noteSym(d[0]),a:d[1],w:others.map(x=>x[1]),ex:`${d[1]}は ${d[2]}（4分音符を1拍としたとき）。`}
     :{id:`gd-${d[0]}-l`,u:'g',q:`4分音符を1拍とすると、${d[1]}は何拍？`,fig:noteSym(d[0]),a:d[2],w:others.map(x=>x[2]),ex:'全音符4拍 → 2分音符2拍 → 4分音符1拍 → 8分音符半拍 → 16分音符4分の1拍。'}},
 dyn(){const d=pick(DYN),k=Math.floor(Math.random()*3);const others=shuffle(DYN.filter(x=>x!==d)).slice(0,3);
   if(k===0)return {id:`gy-${d[0]}-m`,u:'g',q:`強弱記号 <span class="dyn">${d[0]}</span> の意味は？`,a:d[2],w:others.map(x=>x[2]),ex:`${d[0]}＝${d[1]}＝${d[2]}。`};
   if(k===1)return {id:`gy-${d[0]}-r`,u:'g',q:`強弱記号 <span class="dyn">${d[0]}</span> の読み方は？`,a:d[1],w:others.map(x=>x[1]),ex:`${d[0]}＝${d[1]}＝${d[2]}。`};
   return {id:`gy-${d[0]}-s`,u:'g',q:`「${d[2]}」を表す強弱記号は？`,a:d[0],w:others.map(x=>x[0]),ex:`${d[0]}＝${d[1]}。`,dynOpt:1}},
 tempo(){const d=pick(TEMPO),k=Math.random()<.5;const others=TEMPO.filter(x=>x!==d);
   return k?{id:`gt-${d[0]}-m`,u:'g',q:`速度記号 <i>${d[0]}</i> の意味は？`,a:d[2],w:others.map(x=>x[2]),ex:`${d[0]}（${d[1]}）＝${d[2]}。`}
     :{id:`gt-${d[0]}-s`,u:'g',q:`「${d[2]}」を表す速度記号は？`,a:d[0],w:others.map(x=>x[0]),ex:`${d[0]}（${d[1]}）。`}},
 scale(){const S=[['okinawa','沖縄音階'],['minyo','民謡音階'],['ritsu','律音階'],['miyako','都節音階']];const s=pick(S);
   return {id:`ys-${s[0]}`,u:'y',q:'▶を押して聴こう。この五音音階はどれ？（ドから上がります）',fig:`<button class="btn" data-play="${s[0]}">▶ 音階を聴く</button>`,a:s[1],w:S.filter(x=>x!==s).map(x=>x[1]),ex:'律＝ド・レ・ファ・ソ・ラ／都節＝ド・レ♭・ファ・ソ・ラ♭／民謡＝ド・ミ♭・ファ・ソ・シ♭／沖縄＝ド・ミ・ファ・ソ・シ',listen:1}}
};
function poolFor(u){
  let pool=Q[u].map(q=>Object.assign({u},q,{fig:q.fig?q.fig():null}));
  if(u==='g'){for(let i=0;i<5;i++)pool.push(GEN.read());for(let i=0;i<3;i++)pool.push(GEN.dur());for(let i=0;i<3;i++)pool.push(GEN.dyn());for(let i=0;i<2;i++)pool.push(GEN.tempo());}
  if(u==='y'){pool.push(GEN.scale(),GEN.scale());}
  // 同じidの重複をのぞく
  const seen=new Set();return pool.filter(q=>seen.has(q.id)?false:(seen.add(q.id),true));
}

  <div class="row2"><div class="ucard u-all" id="toAll"><span class="best">${best.all!=null?'最高 '+best.all+'点':'20問'}</span><div class="ic">📝</div><h3>総合テスト（20問）</h3><p>3つの単元からまぜて出題。本番の前にどうぞ。</p></div>

function unit(u,tab){
  const U=UNITS[u];app.className=U.cls;scrollTo(0,0);setHide(tab==='sum');
  if(hideMode)app.classList.add('hide-k');
  const tabs=[['sum','📖 まとめ'],['flash','🃏 一問一答'],['quiz','✅ 4択クイズ（10問）']];
  app.innerHTML=`<div class="toolbar"><button class="btn ghost" id="back">← もどる</button><h2 style="margin:0">${U.ic} ${U.name}</h2></div>
  <div class="tabs">${tabs.map(t=>`<button data-t="${t[0]}" class="${t[0]===tab?'on':''}">${t[1]}</button>`).join('')}</div><div id="body"></div>`;
  app.querySelector('#back').onclick=home;
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>unit(u,b.dataset.t));
  const body=app.querySelector('#body');
  if(tab==='sum'){body.innerHTML=`<p class="note">🙈 上の「赤字をかくす」を押すと、赤い語句がかくれる。タップすると1つずつ見られるよ。</p>`+SUMMARY[u]()+`<div style="text-align:center;margin-top:18px"><button class="btn big" id="go">✅ 4択クイズで確かめる</button></div>`;body.querySelector('#go').onclick=()=>unit(u,'quiz')}
  if(tab==='flash')flash(u,body);
  if(tab==='quiz')quiz(shuffle(poolFor(u)).slice(0,10),body,u);
}

function flash(u,body){
  let deck=shuffle(Q[u].filter(q=>!q.nf)),done=0;const total=deck.length;
  if(u==='g'){deck=deck.concat(shuffle([...DYN.map(d=>({q:`<span class="dyn">${d[0]}</span> の読み方と意味`,a:`${d[1]}／${d[2]}`})),...TEMPO.map(d=>({q:`<i>${d[0]}</i> の意味`,a:d[2]})),...DUR.map(d=>({q:`${d[1]}の長さ（4分音符＝1拍）`,a:d[2]}))]))}
  const T=deck.length;
  function show(){
    if(!deck.length){body.innerHTML=`<div class="flash"><div class="fq">🎉 全部「わかった」になった！</div><div class="hint">次は4択クイズで確かめよう</div></div><div class="frow"><button class="btn" id="again">もう一度</button></div>`;body.querySelector('#again').onclick=()=>flash(u,body);return}
    const c=deck[0];let open=false;
    body.innerHTML=`<div class="qhead"><span>のこり ${deck.length}枚</span><span>わかった ${T-deck.length}／${T}</span></div><div class="bar"><i style="width:${(T-deck.length)/T*100}%"></i></div>
    <div class="flash" id="card"><div class="fq">${c.q}</div><div class="fa" style="visibility:hidden">${c.a}</div><div class="hint">タップして答えを見る</div></div>
    <div class="frow" id="btns" style="visibility:hidden"><button class="btn ghost" id="later">🔁 もう一回</button><button class="btn" id="got">⭕ わかった</button></div>`;
    body.querySelector('#card').onclick=()=>{open=true;body.querySelector('.fa').style.visibility='visible';body.querySelector('.hint').textContent='';body.querySelector('#btns').style.visibility='visible'};
    body.querySelector('#got').onclick=()=>{deck.shift();show()};
    body.querySelector('#later').onclick=()=>{deck.push(deck.shift());show()};
  }
  show();
}

function quiz(list,body,key){
  let i=0,score=0;const wrong=[];const miss=store.get('miss',{});
  function show(){
    const q=list[i];const opts=shuffle([q.a,...q.w]);const C=q.u?UNITS[q.u]:null;
    body.innerHTML=`<div class="qbox ${C?C.cls:''}"><div class="qhead"><span>${C?C.ic+' '+C.short:''}</span><span>${i+1} / ${list.length}　正解 ${score}</span></div><div class="bar"><i style="width:${i/list.length*100}%"></i></div>
    <p class="qtext">${q.q}</p>${q.fig?`<div class="fig">${q.fig}</div>`:''}
    <div class="opts">${opts.map((o,j)=>`<button class="opt" data-j="${j}"><b>${'アイウエ'[j]}</b>　<span class="${q.dynOpt?'dyn':''}">${o}</span></button>`).join('')}</div><div id="fb"></div></div>`;
    if(q.listen)setTimeout(()=>playSeq(SCALES[q.id.slice(3)]),300);
    body.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok=opts[b.dataset.j]===q.a;
      body.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(opts[x.dataset.j]===q.a)x.classList.add('ok')});
      if(!ok)b.classList.add('ng');
      if(ok){score++;delete miss[q.id]}else{wrong.push(q);miss[q.id]={u:q.u,q:q.q,fig:q.fig,a:q.a,w:q.w,ex:q.ex,dynOpt:q.dynOpt,listen:q.listen}}
      store.set('miss',miss);
      body.querySelector('#fb').innerHTML=`<div class="fb ${ok?'ok':'ng'}"><b class="t">${ok?'⭕ 正解！':'❌ ざんねん'}</b>　正解：<b>${q.a}</b><br>${q.ex||''}</div>
      <div style="text-align:right;margin-top:12px"><button class="btn" id="next">${i+1<list.length?'次へ →':'結果を見る'}</button></div>`;
      const nx=body.querySelector('#next');nx.focus();nx.onclick=()=>{i++;i<list.length?show():result()};
    });
  }
  function result(){
    const pt=Math.round(score/list.length*100);
    if(key&&key!=='miss'){const best=store.get('best',{});if(best[key]==null||pt>best[key])best[key]=pt;store.set('best',best)}
    const msg=pt===100?'🎉 パーフェクト！':pt>=80?'👍 よくできました！':pt>=60?'🙂 あと少し！まとめを見直そう':'📖 まとめにもどって、赤字を確認しよう';
    body.innerHTML=`<div class="qbox"><div class="res"><div>${list.length}問中 ${score}問 正解</div><div class="score">${pt}点</div><p>${msg}</p>
    <div class="frow"><button class="btn" id="re">もう一度（問題が入れかわる）</button><button class="btn ghost" id="hm">ホームへ</button></div></div>
    ${wrong.length?`<div class="mlist"><h3>まちがえた問題</h3>${wrong.map(q=>`<div class="mitem">${q.q}${q.fig&&!q.listen?`<div class="fig">${q.fig}</div>`:''}<div>正解：<span class="a">${q.a}</span></div><div class="note">${q.ex||''}</div></div>`).join('')}<p class="note">まちがえた問題は「まちがいノート」にも入っています。</p></div>`:''}</div>`;
    body.querySelector('#re').onclick=()=>{key==='all'?startAll():key==='miss'?missNote():unit(key,'quiz')};
    body.querySelector('#hm').onclick=home;
  }
  show();
}

function startAll(){
  setHide(false);app.className='c-all';scrollTo(0,0);
  const list=shuffle([...shuffle(poolFor('g')).slice(0,7),...shuffle(poolFor('m')).slice(0,6),...shuffle(poolFor('y')).slice(0,7)]);
  app.innerHTML=`<div class="toolbar"><button class="btn ghost" id="back">← もどる</button><h2 style="margin:0">📝 総合テスト</h2></div><div id="body"></div>`;
  app.querySelector('#back').onclick=home;quiz(list,app.querySelector('#body'),'all');
}

function missNote(){
  setHide(false);app.className='c-all';scrollTo(0,0);
  const miss=store.get('miss',{});const ids=Object.keys(miss);
  app.innerHTML=`<div class="toolbar"><button class="btn ghost" id="back">← もどる</button><h2 style="margin:0">📒 まちがいノート（${ids.length}問）</h2></div><div id="body"></div>`;
  app.querySelector('#back').onclick=home;const body=app.querySelector('#body');
  if(!ids.length){body.innerHTML=`<div class="qbox"><p>まちがえた問題はありません。クイズに挑戦しよう！</p></div>`;return}
  body.innerHTML=`<div class="toolbar"><button class="btn" id="retry">🔁 まちがえた問題だけ解く</button><button class="btn ghost" id="clr">ノートを空にする</button></div>
  <div class="mlist">${ids.map(id=>{const q=miss[id];return `<div class="mitem"><span class="note">${UNITS[q.u]?UNITS[q.u].ic+' '+UNITS[q.u].short:''}</span><br>${q.q}${q.fig&&!q.listen?`<div class="fig">${q.fig}</div>`:''}<div>正解：<span class="a">${q.a}</span></div><div class="note">${q.ex||''}</div></div>`}).join('')}</div>`;
  body.querySelector('#retry').onclick=()=>quiz(shuffle(ids.map(id=>Object.assign({id},miss[id]))),body,'miss');
  body.querySelector('#clr').onclick=()=>{if(confirm('まちがいノートを空にしますか？')){store.set('miss',{});missNote()}};
}

home();
</script>
</body>
</html>
