<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音楽テスト勉強 2年</title>
<style>
:root{
  --bg:#f6f4ef; --card:#fff; --ink:#1f2633; --sub:#5b6474; --line:#d9dde4;
  --gaku:#1e6fa8; --gaku-l:#e6f0f8; --gaku1:#5a6f8c; --gaku1-l:#eceff4;
  --eten:#b23a48; --eten-l:#fbecee; --bol:#c46a12; --bol-l:#fdf1e2;
  --ok:#2e7d4f; --ok-l:#e5f4ea; --ng:#c62828; --ng-l:#fdeaea; --key:#d62828; --mark:#fff3b0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181e; --card:#20242c; --ink:#e8eaee; --sub:#a3abb8; --line:#363c47;
    --gaku-l:#1b2c3b; --gaku1-l:#262c36; --eten-l:#3a2026; --bol-l:#3a2a18;
    --ok-l:#1b3326; --ng-l:#3d1d1d; --key:#ff7b7b; --mark:#4a4220;
  }
}
:root[data-theme="dark"]{
  --bg:#15181e; --card:#20242c; --ink:#e8eaee; --sub:#a3abb8; --line:#363c47;
  --gaku-l:#1b2c3b; --gaku1-l:#262c36; --eten-l:#3a2026; --bol-l:#3a2a18;
  --ok-l:#1b3326; --ng-l:#3d1d1d; --key:#ff7b7b; --mark:#4a4220;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Sans","Meiryo",system-ui,sans-serif;line-height:1.7;-webkit-text-size-adjust:100%}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.hin{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:1.15rem;margin:0;flex:1 1 220px}
h1 small{display:block;font-size:.75rem;color:var(--sub);font-weight:normal}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:7px 14px;border-radius:999px;font:inherit;font-size:.9rem;cursor:pointer}
nav button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
main{max-width:860px;margin:0 auto;padding:16px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
h2{font-size:1.05rem;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:0;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer;text-align:left;flex:1 1 170px}
.chip b{display:block}
.chip span{font-size:.8rem;color:var(--sub)}
.chip.on[data-c=gaku]{border-color:var(--gaku);background:var(--gaku-l)}
.chip.on[data-c=gaku1]{border-color:var(--gaku1);background:var(--gaku1-l)}
.chip.on[data-c=eten]{border-color:var(--eten);background:var(--eten-l)}
.chip.on[data-c=bol]{border-color:var(--bol);background:var(--bol-l)}
.chip.on:not([data-c]){border-color:var(--ink);background:var(--bg)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:none;border-radius:12px;padding:12px 22px;font:inherit;font-weight:bold;cursor:pointer;background:var(--ink);color:var(--card)}
.btn.sub{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.big{font-size:1.1rem;padding:14px 30px}
.muted{color:var(--sub);font-size:.88rem}
.tag{display:inline-block;font-size:.75rem;font-weight:bold;padding:2px 10px;border-radius:999px;color:#fff}
.tag.gaku{background:var(--gaku)}.tag.gaku1{background:var(--gaku1)}.tag.eten{background:var(--eten)}.tag.bol{background:var(--bol)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.q{font-size:1.15rem;font-weight:bold;margin:10px 0 12px}
.fig{margin:8px 0 14px;text-align:center;min-width:0}
.fig>svg{display:block;margin:0 auto 8px;max-width:100%;height:auto;color:var(--ink)}
.fig .bars{justify-content:center;margin-top:28px}
.play{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:.85rem;cursor:pointer}
.choices{display:grid;gap:10px}
.choice{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:1rem;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center}
.choice:hover:not(:disabled){border-color:var(--sub)}
.choice .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:.8rem;font-weight:bold}
.choice.ok{border-color:var(--ok);background:var(--ok-l)}
.choice.ng{border-color:var(--ng);background:var(--ng-l)}
.choice:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;display:none}
.fb.ok{display:block;background:var(--ok-l)}
.fb.ng{display:block;background:var(--ng-l)}
.fb b{font-size:1.05rem}
.ans{font-size:1.25rem;font-weight:bold;color:var(--key);margin:4px 0}
.score{font-size:2.6rem;font-weight:bold;text-align:center;margin:6px 0}
.miss{border-top:1px solid var(--line);padding:10px 0}
.miss:first-child{border-top:none}
/* まとめ */
.sum h3{font-size:1rem;margin:16px 0 6px;padding-left:10px;border-left:5px solid var(--gaku)}
.sum[data-c=eten] h3{border-color:var(--eten)}
.sum[data-c=bol] h3{border-color:var(--bol)}
.sum[data-c=gaku1] h3{border-color:var(--gaku1)}
.sum ul{margin:0;padding-left:1.3em}
.sum li{margin:3px 0}
.k{color:var(--key);font-weight:bold;border-radius:4px;transition:background .15s}
.hide .k{color:transparent;background:var(--mark);cursor:pointer;user-select:none;border-bottom:2px solid var(--key)}
.hide .k.open{color:var(--key);background:transparent}
table.t{border-collapse:collapse;width:100%;font-size:.92rem;margin:6px 0}
table.t th,table.t td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
table.t th{background:var(--bg);white-space:nowrap}
.sumbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:10px}
.bars{display:flex;margin:6px 0}
.bars .m{border:2px solid var(--ink);border-left:none;min-width:72px;height:54px;position:relative;display:grid;place-items:center;font-size:1.3rem;font-weight:bold}
.bars .m:first-child{border-left:2px solid var(--ink)}
.bars .m.end{border-right:6px double var(--ink)}
.bars .mk{position:absolute;top:-24px;font-size:.85rem;font-style:italic;font-family:Georgia,serif;white-space:nowrap}
.bars .mk.r{right:2px}.bars .mk.l{left:2px}
.flash .ansbox{display:none}
.flash.show .ansbox{display:block}
/* まとめ：全体像・ヒント・音階の図 */
.map{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:4px 0 6px;font-size:.95rem}
.map ol{margin:4px 0 0;padding-left:1.4em}
.tip{background:var(--bol-l);border-left:5px solid var(--bol);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:.92rem}
.sum p{margin:6px 0}
.sum .cap{font-size:.88rem;color:var(--sub);text-align:center;margin:2px 0 8px}
.sum table .fig{margin:4px 0}
.sum table .fig>svg{margin:-6px auto -22px;width:130px;max-width:100%;height:auto}
.sum table td:has(.fig){text-align:center}
.steps{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px;margin:4px 0 10px}
.steps b{border:2px solid var(--ink);border-radius:8px;padding:2px 7px;min-width:2.2em;text-align:center;background:var(--card)}
.steps i{font-style:normal;font-size:.8rem;padding:0 3px;color:var(--sub)}
.steps i.h{color:var(--key);font-weight:bold}
footer{max-width:860px;margin:0 auto;padding:0 16px 30px;font-size:.78rem;color:var(--sub)}
@media (max-width:520px){ .q{font-size:1.05rem} .bars .m{min-width:56px} }
</style>
</head>
<body>
<header><div class="hin">
  <h1>音楽 テスト勉強アプリ <small>2年｜楽典（音階と調・音程とリズムの記号）・越天楽・ボレロ</small></h1>
  <nav>
    <button data-v="sum">まとめ</button>
    <button data-v="quiz">問題</button>
    <button data-v="rec">きろく</button>
  </nav>
</div></header>
<main id="app"></main>
<footer>教育出版「中学音楽」の授業内容（楽典2年・雅楽「越天楽」・ラヴェル「ボレロ」）にそろえた自習用です。記録はこの端末のブラウザの中だけに残り、どこにも送られません。</footer>

<script>
/* ===================== 図：五線・鍵盤・反復 ===================== */
const STEP={c:0,d:1,e:2,f:3,g:4,a:5,b:6};
const SEMI={c:0,d:2,e:4,f:5,g:7,a:9,b:11};
function parseP(p){const m=p.match(/^([a-g])(#|b)?(\d)$/);return{l:m[1],acc:m[2]||'',o:+m[3],st:STEP[m[1]]+7*(+m[3]-4),midi:12*(+m[3]+1)+SEMI[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)}}
// ト音記号（簡略形）
function gclef(x,gy){return `<path d="M${x+7} ${gy+24} C${x+12} ${gy+26} ${x+14} ${gy+18} ${x+13} ${gy+8} L${x+10} ${gy-30} C${x+9} ${gy-42} ${x+19} ${gy-44} ${x+19} ${gy-33} C${x+19} ${gy-22} ${x+1} ${gy-14} ${x+1} ${gy-1} C${x+1} ${gy+11} ${x+21} ${gy+12} ${x+21} ${gy+1} C${x+21} ${gy-9} ${x+8} ${gy-9} ${x+9} ${gy+2}" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${x+6}" cy="${gy+21}" r="3.6" fill="currentColor"/>`}
function sharp(x,y){return `<g stroke="currentColor" stroke-width="1.3"><line x1="${x-2}" y1="${y-9}" x2="${x-2}" y2="${y+9}"/><line x1="${x+2}" y1="${y-10}" x2="${x+2}" y2="${y+8}"/></g><g stroke="currentColor" stroke-width="3"><line x1="${x-5}" y1="${y-2}" x2="${x+5}" y2="${y-4}"/><line x1="${x-5}" y1="${y+4}" x2="${x+5}" y2="${y+2}"/></g>`}
function flat(x,y){return `<path d="M${x-3} ${y-14} L${x-3} ${y+5} C${x+4} ${y} ${x+6} ${y-5} ${x+1} ${y-5} C${x-1} ${y-5} ${x-2} ${y-4} ${x-3} ${y-2}" fill="none" stroke="currentColor" stroke-width="1.8"/>`}
/* staff: {notes:[{p,d,dot,art}], key:'#1'|'b1', tie:[i,j], slur:[i,j], trip:[i,j], fermata, clef:true} */
function staffSVG(f){
  const top=30, sp=10, gap=f.gap||56, notes=f.notes||[];
  const clef=f.clef!==false, ksx=clef?44:14;
  const ks=f.key==='#1'?1:f.key==='b1'?1:0;
  const nx0=ksx+(ks?22:6)+20;
  const W=Math.max(nx0+notes.length*gap+10, f.key&&!notes.length?120:0, 120);
  const yOf=st=>top+40-(st-2)*5;
  let s=`<svg viewBox="0 0 ${W} 130" width="${Math.min(W*1.6,560)}" role="img" aria-label="五線の図">`;
  for(let i=0;i<5;i++)s+=`<line x1="4" x2="${W-4}" y1="${top+i*sp}" y2="${top+i*sp}" stroke="currentColor" stroke-width="1"/>`;
  if(clef)s+=gclef(12,top+30);
  if(f.key==='#1')s+=sharp(ksx+8,yOf(10));
  if(f.key==='b1')s+=flat(ksx+8,yOf(6));
  const pos=[];
  notes.forEach((n,i)=>{
    const P=parseP(n.p), x=nx0+i*gap, y=yOf(P.st), d=n.d||'w';
    pos.push({x,y});
    // 加線
    for(let st=0;st>=P.st;st-=2)s+=`<line x1="${x-11}" x2="${x+11}" y1="${yOf(st)}" y2="${yOf(st)}" stroke="currentColor" stroke-width="1.2"/>`;
    for(let st=12;st<=P.st;st+=2)s+=`<line x1="${x-11}" x2="${x+11}" y1="${yOf(st)}" y2="${yOf(st)}" stroke="currentColor" stroke-width="1.2"/>`;
    if(P.acc==='#')s+=sharp(x-17,y);
    if(P.acc==='b')s+=flat(x-16,y);
    const filled=(d==='q'||d==='e');
    s+=`<ellipse cx="${x}" cy="${y}" rx="${d==='w'?7.5:6.2}" ry="${d==='w'?5:4.4}" transform="rotate(${d==='w'?-10:-22} ${x} ${y})" fill="${filled?'currentColor':'none'}" stroke="currentColor" stroke-width="${d==='w'?2.4:1.8}"/>`;
    if(d!=='w'){
      s+=`<line x1="${x+5.6}" x2="${x+5.6}" y1="${y-1}" y2="${y-32}" stroke="currentColor" stroke-width="1.4"/>`;
      if(d==='e'&&!n.beam)s+=`<path d="M${x+5.6} ${y-32} C${x+8} ${y-24} ${x+16} ${y-22} ${x+13} ${y-12}" fill="none" stroke="currentColor" stroke-width="2"/>`;
    }
    if(n.dot)s+=`<circle cx="${x+13}" cy="${P.st%2===0?y-5:y}" r="2" fill="currentColor"/>`;
    if(n.art==='stac')s+=`<circle cx="${x}" cy="${y+11}" r="2.2" fill="currentColor"/>`;
    if(n.art==='ten')s+=`<line x1="${x-6}" x2="${x+6}" y1="${y+11}" y2="${y+11}" stroke="currentColor" stroke-width="2"/>`;
    if(n.art==='acc')s+=`<path d="M${x-7} ${y+8} L${x+7} ${y+12} L${x-7} ${y+16}" fill="none" stroke="currentColor" stroke-width="1.6"/>`;
    if(n.art==='ferm')s+=`<path d="M${x-10} ${top-6} A10 9 0 0 1 ${x+10} ${top-6}" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="${x}" cy="${top-8}" r="2" fill="currentColor"/>`;
  });
  // 連桁（8分の3連符など）
  if(f.beam){const[a,b]=f.beam;s+=`<line x1="${pos[a].x+5.6}" x2="${pos[b].x+5.6}" y1="${Math.min(pos[a].y,pos[b].y)-32}" y2="${Math.min(pos[a].y,pos[b].y)-32}" stroke="currentColor" stroke-width="4.5"/>`;
    for(let i=a;i<=b;i++){const yy=Math.min(pos[a].y,pos[b].y)-32;s+=`<line x1="${pos[i].x+5.6}" x2="${pos[i].x+5.6}" y1="${pos[i].y-1}" y2="${yy}" stroke="currentColor" stroke-width="1.4"/>`;}}
  if(f.trip){const[a,b]=f.trip,yy=Math.min(...pos.slice(a,b+1).map(p=>p.y))-44;s+=`<text x="${(pos[a].x+pos[b].x)/2+5}" y="${yy}" font-size="13" font-style="italic" font-weight="bold" text-anchor="middle" fill="currentColor">3</text>`}
  const arc=(a,b,under)=>{const p=pos[a],q=pos[b],dy=under?9:-9,cy=under?Math.max(p.y,q.y)+20:Math.min(p.y,q.y)-20;
    return `<path d="M${p.x+2} ${p.y+dy} Q${(p.x+q.x)/2} ${cy} ${q.x-2} ${q.y+dy}" fill="none" stroke="currentColor" stroke-width="1.8"/>`};
  if(f.tie)s+=arc(f.tie[0],f.tie[1],true);
  if(f.slur)s+=arc(f.slur[0],f.slur[1],true);
  return s+'</svg>';
}
const WK=['C','D','E','F','G','A','B','C2','D2','E2'];
const BK={'C#':1,'D#':2,'F#':4,'G#':5,'A#':6,'C#2':8,'D#2':9};
function kbSVG(f){
  const w=36,h=130,n=WK.length;let s=`<svg viewBox="0 0 ${n*w+2} ${h+26}" width="${Math.min((n*w+2)*1.3,520)}" role="img" aria-label="鍵盤の図">`;
  const lab={C:'ド',D:'レ',E:'ミ',F:'ファ',G:'ソ',A:'ラ',B:'シ',C2:'ド',D2:'レ',E2:'ミ'};
  WK.forEach((k,i)=>{const on=f.k.includes(k);s+=`<rect x="${1+i*w}" y="1" width="${w}" height="${h}" fill="${on?'#ffd54a':'#fff'}" stroke="#333" stroke-width="1.2" rx="3"/><text x="${1+i*w+w/2}" y="${h+18}" font-size="12" text-anchor="middle" fill="currentColor">${lab[k]}</text>`});
  Object.entries(BK).forEach(([k,i])=>{const on=f.k.includes(k);s+=`<rect x="${1+i*w-11}" y="1" width="22" height="80" fill="${on?'#ffb300':'#222'}" stroke="#111" rx="2"/>`});
  return s+'</svg>';
}
const segno=`<svg viewBox="0 0 20 24" width="18" height="22" style="vertical-align:middle"><path d="M15 5 C12 1 4 2 5 7 C6 11 15 11 15 16 C15 21 7 22 5 18" fill="none" stroke="currentColor" stroke-width="2"/><line x1="3" y1="21" x2="17" y2="3" stroke="currentColor" stroke-width="1.6"/><circle cx="4" cy="12" r="1.6" fill="currentColor"/><circle cx="16" cy="12" r="1.6" fill="currentColor"/></svg>`;
function barsHTML(f){
  return `<div class="bars">${f.m.map((m,i)=>`<div class="m${i===f.m.length-1?' end':''}">${m.l}${m.segno?`<span class="mk l">${segno}</span>`:''}${m.fine?'<span class="mk r">Fine</span>':''}${m.ds?'<span class="mk r">D.S.</span>':''}${m.dc?'<span class="mk r">D.C.</span>':''}</div>`).join('')}</div>`;
}
function figHTML(f){
  if(!f)return'';
  let h=f.t==='staff'?staffSVG(f):f.t==='kb'?kbSVG(f):f.t==='bars'?barsHTML(f):'';
  if(f.t==='staff'&&f.notes&&f.notes.length&&f.sound!==false)h+=`<button class="play" data-play='${JSON.stringify(f.notes.map(n=>n.p))}'>▶ 音を聴く</button>`;
  if(f.t==='kb')h+=`<button class="play" data-play='${JSON.stringify(f.k.map(kbToP))}'>▶ 音を聴く</button>`;
  return `<div class="fig">${h}</div>`;
}
function kbToP(k){const two=k.endsWith('2');const b=k.replace('2','');return b[0].toLowerCase()+(b[1]||'')+(two?5:4)}

/* ===================== 音 ===================== */
let AC=null;
function playNotes(list,dur=0.55){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();}catch(e){return}
  if(AC.state==='suspended')AC.resume();
  let t=AC.currentTime+0.05;
  list.forEach(p=>{const f=440*Math.pow(2,(parseP(p).midi-69)/12);
    const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+dur*1.1);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur*1.2);t+=dur;});
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-play]');if(b)playNotes(JSON.parse(b.dataset.play))});

/* ===================== 問題データ ===================== */
// c:分野 / t:小見出し / q:問題 / a:正答 / d:ほかの選択肢 / ex:解説 / fig:図
const N=(p,d,o={})=>Object.assign({p,d},o);
const Q=[
/* ---------- 楽典（2年） ---------- */
{c:'gaku',t:'音階',q:'1オクターブの音を、高さの順に階段のように並べたものを何といいますか。',a:'音階',d:['和音','音程','調号'],ex:'高さの順に並べた「音の階段」が音階。'},
{c:'gaku',t:'全音・半音',q:'となり合う鍵盤どうし（間に鍵盤がない）の音の幅を何といいますか。',a:'半音',d:['全音','1度','1オクターブ'],ex:'となり合う鍵盤＝半音。黒鍵もふくめて数える。'},
{c:'gaku',t:'全音・半音',q:'全音は、半音いくつ分ですか。',a:'半音2つ分',d:['半音1つ分','半音3つ分','半音4つ分'],ex:'全音＝半音2つ。'},

<p><b>型</b>：〔変わらないもの〕があるのに、〔変わるもの〕があるので、〔どう聴こえるか〕。</p>
<table class="t"><tr><th>✕ 根拠がない</th><th>○ 聴き取ったことが根拠になっている</th></tr>
<tr><td>だんだんもり上がって、あきなかった。</td><td>同じリズムと旋律を何度もくり返すが、旋律を演奏する楽器が次々に変わり、楽器の数もふえて、だんだん強くなっていく。だから同じくり返しでも音色が毎回ちがって聞こえ、最後まであきずに聴ける。</td></tr></table>`)},
};

/* ===================== 状態と保存 ===================== */
const CAT={gaku:'楽典',gaku1:'楽典(1年)',eten:'越天楽',bol:'ボレロ'};
const LS='ongaku2-test-v1';
let store={weak:{},hist:[],sel:['gaku','eten','bol'],mode:'4',hide:false};
try{const s=JSON.parse(localStorage.getItem(LS));if(s)store=Object.assign(store,s)}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(store))}catch(e){}}

const app=document.getElementById('app');
let view='quiz', sumTab='gaku', run=null;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;run=null;render()});
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  if(view==='sum')return renderSum();
  if(view==='rec')return renderRec();
  if(run)return run.done?renderResult():renderQ();
  renderSetup();
}

function renderSetup(){
  const weakN=Object.keys(store.weak).length;
  const pool=Q.filter(q=>store.sel.includes(q.c));
  app.innerHTML=`
  <div class="card"><h2>① 範囲をえらぶ</h2><div class="chips">
    ${Object.keys(CAT).map(c=>`<button class="chip${store.sel.includes(c)?' on':''}" data-c="${c}"><b>${SUM[c].name}</b><span>${SUM[c].sub}・${Q.filter(q=>q.c===c).length}問</span></button>`).join('')}
  </div></div>
  <div class="card"><h2>② やり方をえらぶ</h2><div class="chips">
    <button class="chip${store.mode==='4'?' on':''}" data-m="4"><b>4択クイズ</b><span>えらんで答える。すぐに解説</span></button>
    <button class="chip${store.mode==='f'?' on':''}" data-m="f"><b>一問一答</b><span>頭の中で答えてから「答え」を見る</span></button>
  </div></div>
  <div class="card"><h2>③ スタート</h2>
    <div class="row">
      <button class="btn big" data-start="10" ${pool.length?'':'disabled'}>10問</button>
      <button class="btn big" data-start="20" ${pool.length?'':'disabled'}>20問</button>
      <button class="btn big sub" data-start="all" ${pool.length?'':'disabled'}>全部（${pool.length}問）</button>
      <button class="btn big sub" data-start="weak" ${weakN?'':'disabled'}>苦手だけ（${weakN}問）</button>
    </div>
    <p class="muted">まちがえた問題は「苦手」に入り、2回続けて正解すると外れます。テスト前は <b>まとめ</b> の「かくす」で赤字を覚えてから、問題をとくのがおすすめ。</p>
  </div>`;
  app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const c=b.dataset.c;store.sel=store.sel.includes(c)?store.sel.filter(x=>x!==c):[...store.sel,c];save();render()});
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{store.mode=b.dataset.m;save();render()});
  app.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start));
}

function start(kind){
  let list=kind==='weak'?Q.filter(q=>store.weak[q.id]):Q.filter(q=>store.sel.includes(q.c));
  list=shuffle(list);
  if(kind==='10'||kind==='20')list=list.slice(0,+kind);
  run={list,i:0,ok:0,miss:[],answered:false,mode:store.mode,kind,done:false};
  render();
}

function mark(q,ok){
  const w=store.weak[q.id];
  if(!ok)store.weak[q.id]={n:0};
  else if(w){w.n++;if(w.n>=2)delete store.weak[q.id]}
  save();
}

function renderQ(){
  const q=run.list[run.i], n=run.list.length;
  const head=`<div class="row" style="justify-content:space-between"><span class="tag ${q.c}">${CAT[q.c]}｜${q.t}</span><span class="muted">${run.i+1} / ${n}問　正解 ${run.ok}</span></div>
  <div class="prog"><i style="width:${run.i/n*100}%"></i></div>`;
  if(run.mode==='f'){
    app.innerHTML=`<div class="card flash" id="fc">${head}<div class="q">${esc(q.q)}</div>${figHTML(q.fig)}
      <div class="row" id="showRow"><button class="btn big" id="show">答えを見る</button></div>
      <div class="ansbox"><div class="ans">${esc(q.a)}</div><p>${esc(q.ex)}</p>
      <div class="row"><button class="btn big" data-self="1" style="background:var(--ok)">○ 言えた</button><button class="btn big" data-self="0" style="background:var(--ng)">× まだ</button></div></div>
      <p class="row" style="margin-top:14px"><button class="btn sub" id="quit">やめる</button></p></div>`;
    app.querySelector('#show').onclick=()=>{app.querySelector('#fc').classList.add('show');app.querySelector('#showRow').style.display='none'};
    app.querySelectorAll('[data-self]').forEach(b=>b.onclick=()=>{const ok=b.dataset.self==='1';mark(q,ok);if(ok)run.ok++;else run.miss.push(q);next()});
  }else{
    if(!run.opts||run.optsFor!==run.i){run.opts=shuffle([q.a,...q.d]);run.optsFor=run.i;run.answered=false}
    app.innerHTML=`<div class="card">${head}<div class="q">${esc(q.q)}</div>${figHTML(q.fig)}
      <div class="choices">${run.opts.map((o,k)=>`<button class="choice" data-o="${k}"><span class="n">${'アイウエ'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>
      <div class="fb" id="fb"></div>
      <p class="row" style="margin-top:14px;justify-content:space-between"><button class="btn sub" id="quit">やめる</button><button class="btn big" id="nx" style="display:none">${run.i+1<n?'次へ →':'結果を見る'}</button></p></div>`;
    app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
      if(run.answered)return;run.answered=true;
      const pick=run.opts[+b.dataset.o], ok=pick===q.a;
      app.querySelectorAll('.choice').forEach(c=>{c.disabled=true;const o=run.opts[+c.dataset.o];if(o===q.a)c.classList.add('ok');else if(c===b)c.classList.add('ng')});
      const fb=app.querySelector('#fb');fb.className='fb '+(ok?'ok':'ng');
      fb.innerHTML=`<b>${ok?'⭕ 正解！':'❌ ざんねん'}</b>${ok?'':`<div>正解：<b>${esc(q.a)}</b></div>`}<div>${esc(q.ex)}</div>`;
      mark(q,ok);if(ok)run.ok++;else run.miss.push(q);
      const nx=app.querySelector('#nx');nx.style.display='';nx.focus();nx.onclick=next;
    });
  }
  app.querySelector('#quit').onclick=()=>{run=null;render()};
}
function next(){run.i++;if(run.i>=run.list.length){run.done=true;
  store.hist.unshift({d:new Date().toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}),ok:run.ok,n:run.list.length,cats:[...new Set(run.list.map(q=>CAT[q.c]))].join('・'),mode:run.mode==='f'?'一問一答':'4択'});
  store.hist=store.hist.slice(0,30);save()}
  render();window.scrollTo(0,0)}

function renderResult(){
  const pct=Math.round(run.ok/run.list.length*100);
  const msg=pct===100?'パーフェクト！🎉':pct>=80?'よくできました！あと少し！':pct>=60?'いい調子。まちがえたところを見直そう':'まとめを見てから、もう一度チャレンジ！';
  app.innerHTML=`<div class="card"><h2>結果</h2><div class="score">${run.ok} / ${run.list.length}</div><p style="text-align:center">${pct}点　${msg}</p>
   <div class="row" style="justify-content:center">${run.miss.length?'<button class="btn big" id="again">まちがえた問題だけもう一度</button>':''}<button class="btn big sub" id="back">メニューへ</button></div></div>
   ${run.miss.length?`<div class="card"><h2>まちがえた問題（${run.miss.length}）</h2>${run.miss.map(q=>`<div class="miss"><span class="tag ${q.c}">${CAT[q.c]}</span> ${esc(q.q)}${figHTML(q.fig)}<div class="ans">${esc(q.a)}</div><div class="muted">${esc(q.ex)}</div></div>`).join('')}</div>`:''}`;
  app.querySelector('#back').onclick=()=>{run=null;render()};
  const a=app.querySelector('#again');if(a)a.onclick=()=>{run={list:shuffle(run.miss),i:0,ok:0,miss:[],mode:run.mode,done:false};render()};
}

function renderSum(){
  const s=SUM[sumTab];
  app.innerHTML=`<div class="card"><div class="sumbar"><div class="chips" style="flex:1">${Object.keys(SUM).map(c=>`<button class="chip${c===sumTab?' on':''}" data-c="${c}" data-tab="${c}" style="flex:1 1 130px"><b>${SUM[c].name}</b></button>`).join('')}</div></div>
  <div class="row" style="justify-content:space-between"><span class="muted">赤字がテストに出やすいところ</span>
  <button class="btn ${store.hide?'':'sub'}" id="hide">${store.hide?'🙈 かくしている（タップで1つずつ見る）':'赤字をかくす'}</button></div>
  ${sumTab==='gaku'?`<div class="row" style="margin-top:10px"><button class="play" data-play='["c4","d4","e4","f4","g4","a4","b4","c5"]'>▶ 長音階（ハ長調）</button><button class="play" data-play='["a4","b4","c5","d5","e5","f5","g5","a5"]'>▶ 自然短音階（イ短調）</button></div>`:''}
  <div class="sum ${store.hide?'hide':''}" data-c="${sumTab}">${s.html}</div></div>`;
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{sumTab=b.dataset.tab;render()});
  app.querySelector('#hide').onclick=()=>{store.hide=!store.hide;save();render()};
  app.querySelectorAll('.hide .k').forEach(k=>k.onclick=()=>k.classList.toggle('open'));
}

function renderRec(){
  const weak=Q.filter(q=>store.weak[q.id]);
  app.innerHTML=`<div class="card"><h2>これまでの記録</h2>${store.hist.length?`<table class="t"><tr><th>日時</th><th>範囲</th><th>やり方</th><th>正解</th></tr>${store.hist.map(h=>`<tr><td>${h.d}</td><td>${h.cats}</td><td>${h.mode}</td><td>${h.ok}/${h.n}</td></tr>`).join('')}</table>`:'<p class="muted">まだ記録がありません。</p>'}</div>
  <div class="card"><h2>苦手な問題（${weak.length}）</h2>${weak.length?weak.map(q=>`<div class="miss"><span class="tag ${q.c}">${CAT[q.c]}</span> ${esc(q.q)}<div class="ans">${esc(q.a)}</div></div>`).join(''):'<p class="muted">苦手な問題はありません。</p>'}
  <p class="row"><button class="btn sub" id="reset">記録をすべて消す</button></p></div>`;
  app.querySelector('#reset').onclick=()=>{if(confirm('記録と苦手リストをすべて消します。よろしいですか？')){store.weak={};store.hist=[];save();render()}};
}
render();
</script>
</body>
</html>
